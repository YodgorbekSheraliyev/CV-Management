services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: myapp-backend:latest
    container_name: backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: "Server=mssql,1433;Database=${MSSQL_DB};User Id=${MSSQL_USER};Password=${MSSQL_PASSWORD};Encrypt=false;TrustServerCertificate=true;"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpiresInDays: "50"

      Google__ClientId: "${GOOGLE_CLIENT_ID}"

      Facebook__AppId: "${FACEBOOK_APP_ID}"
      Facebook__AppSecret: "${FACEBOOK_APP_SECRET}"
      Facebook__GraphApiVersion: "${FACEBOOK_GRAPH_API_VERSION}"

      AllowedOrigins__0: "https://cvmanagement.uz"
      AllowedOrigins__1: "https://www.cvmanagement.uz"

    ports:
      - "127.0.0.1:9080:8080"
    volumes:
      - uploads_data:/app/uploads

    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://cvmanagement.uz/api"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
        VITE_API_STATIC_API: "https://cvmanagement.uz/uploads"
        VITE_FACEBOOK_APP_ID: "${FACEBOOK_APP_ID}"

    image: myapp-frontend:latest
    container_name: frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_PASSWORD}"

    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_PASSWORD\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

    env_file:
      - .env

volumes:
  mssql_data:
  uploads_data:

networks:
  app-network:
    driver: bridge